<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axrachat</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>.font-logo{font-family:'Grand Hotel',cursive}.gradient-ring{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}.scrollbar-hide::-webkit-scrollbar{display:none}.like-anim{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);opacity:0;transition:.2s;pointer-events:none}.like-anim.show{transform:translate(-50%,-50%) scale(1);opacity:.9}</style>
</head>
<body class="bg-white text-black">
<div id="auth" class="min-h-screen flex items-center justify-center p-4 bg-[#fafafa]"><div class="w-full max-w-[350px]"><div class="bg-white border border-zinc-300 px-8 py-8 text-center"><h1 class="font-logo text-[50px] mb-6">Axra</h1><input id="username" placeholder="Username" class="w-full bg-zinc-50 border px-2 py-2.5 text-sm mb-2"><input id="password" type="password" placeholder="Password" class="w-full bg-zinc-50 border px-2 py-2.5 text-sm"><button id="loginBtn" class="w-full bg-[#0095f6] text-white py-2 rounded-lg text-sm mt-3 font-semibold">Log in</button><p id="err" class="text-red-500 text-xs mt-2 hidden"></p></div><div class="bg-white border border-zinc-300 mt-2 py-5 text-center text-sm">Don't have account? <button id="signupBtn" class="text-[#0095f6] font-semibold">Sign up</button></div></div></div>

<div id="app" class="hidden min-h-screen bg-[#fafafa]">
<div class="flex justify-center">
<aside class="hidden md:flex fixed left-0 top-0 h-screen w-[244px] bg-white border-r border-zinc-300 flex-col p-3 gap-1 z-30">
<h1 class="font-logo text-[33px] px-3 py-6">axrachat.</h1>
<nav class="space-y-1">
<button data-view="feed" class="navBtn flex items-center gap-4 p-3 hover:bg-zinc-50 rounded-lg w-full text-left"><i class="fa-solid fa-house text-[22px]"></i> Home</button>
<button class="flex items-center gap-4 p-3 hover:bg-zinc-50 rounded-lg w-full text-left"><i class="fa-solid fa-magnifying-glass text-[22px]"></i> Search</button>
<button class="flex items-center gap-4 p-3 hover:bg-zinc-50 rounded-lg w-full text-left"><i class="fa-regular fa-compass text-[22px]"></i> Explore</button>
<button class="flex items-center gap-4 p-3 hover:bg-zinc-50 rounded-lg w-full text-left"><i class="fa-solid fa-clapperboard text-[22px]"></i> Reels</button>
<button data-view="messages" class="navBtn flex items-center gap-4 p-3 hover:bg-zinc-50 rounded-lg w-full text-left"><i class="fa-regular fa-paper-plane text-[22px]"></i> Messages <span id="msgBadge" class="ml-auto bg-red-500 text-white text-[10px] px-1.5 rounded-full hidden">1</span></button>
<button class="flex items-center gap-4 p-3 hover:bg-zinc-50 rounded-lg w-full text-left"><i class="fa-regular fa-heart text-[22px]"></i> Notifications</button>
<button id="createBtnDesktop" class="flex items-center gap-4 p-3 hover:bg-zinc-50 rounded-lg w-full text-left"><i class="fa-regular fa-square-plus text-[22px]"></i> Create</button>
<button data-view="profile" class="navBtn flex items-center gap-4 p-3 hover:bg-zinc-50 rounded-lg w-full text-left"><img id="sideAvatar" class="w-6 h-6 rounded-full bg-zinc-200"><span id="sideUsername">Profile</span></button>
</nav>
<div class="mt-auto p-3"><button id="logoutBtn" class="flex gap-4 items-center text-sm"><i class="fa-solid fa-bars"></i> More</button></div>
</aside>

<main class="w-full max-w-[630px] md:ml-[244px] xl:mr-[319px] bg-[#fafafa]">
<div id="feedView">
<div class="bg-white border-b md:border border-zinc-300 md:rounded-lg md:mt-6">
<div class="flex gap-4 p-4 overflow-x-auto scrollbar-hide">
<div id="yourStoryBtn" class="flex flex-col items-center gap-1 min-w-[66px] cursor-pointer"><div class="w-[66px] h-[66px] rounded-full bg-zinc-100 flex items-center justify-center border-2 border-dashed relative"><img id="yourStoryAvatar" class="w-full h-full rounded-full object-cover hidden"><i id="yourStoryPlus" class="fa-solid fa-plus"></i><div class="absolute -bottom-1 -right-1 bg-[#0095f6] w-5 h-5 rounded-full flex items-center justify-center text-[10px] text-white"><i class="fa-solid fa-plus"></i></div></div><span class="text-xs">Your story</span></div>
<div id="storiesRow" class="flex gap-4"></div>
</div>
</div>
<div id="feed" class="pb-20"><div id="loadingFeed" class="text-center py-20 text-zinc-500">Loading feed...</div></div>
</div>

<div id="profileView" class="hidden bg-white md:border border-zinc-300 md:rounded-lg md:mt-6 pb-20">
<div class="p-8 border-b">
<div class="flex gap-10">
<img id="profileAvatar" class="w-[77px] h-[77px] md:w-[150px] md:h-[150px] rounded-full bg-zinc-200 object-cover cursor-pointer">
<div class="flex-1"><div class="flex gap-3 items-center mb-4"><h2 id="profileUsername" class="text-xl font-light"></h2><button id="editProfileBtn" class="bg-zinc-100 px-4 py-1.5 rounded-lg text-sm font-semibold">Edit profile</button></div><div class="hidden md:flex gap-8 mb-4"><span><b id="postsCount">0</b> posts</span><span><b id="followersCount">0</b> followers</span><span><b id="followingCount">0</b> following</span></div><div class="text-sm"><div id="profileFullName" class="font-semibold"></div><div id="profileBio" class="whitespace-pre-wrap"></div></div></div>
</div>
</div>
<div class="flex justify-center gap-12 border-t text-xs tracking-widest"><button class="py-3 border-t border-black font-semibold">POSTS</button></div>
<div id="profileGrid" class="grid grid-cols-3 gap-1"></div>
</div>

<div id="messagesView" class="hidden bg-white md:border border-zinc-300 md:rounded-lg md:mt-6 h-[calc(100vh-60px)] md:h-[80vh] flex">
<div id="convList" class="w-full md:w-[350px] border-r flex flex-col">
<div class="p-4 border-b flex justify-between"><h2 id="msgUsername" class="font-semibold"></h2><button id="newMsgBtn"><i class="fa-regular fa-pen-to-square"></i></button></div>
<div id="conversations" class="flex-1 overflow-auto"></div>
</div>
<div id="chatWindow" class="hidden flex-1 flex-col">
<div class="p-4 border-b flex items-center gap-3"><button id="backToList" class="md:hidden"><i class="fa-solid fa-arrow-left"></i></button><img id="chatAvatar" class="w-8 h-8 rounded-full bg-zinc-200"><span id="chatName" class="font-semibold text-sm"></span></div>
<div id="chatMessages" class="flex-1 overflow-auto p-4 space-y-2"></div>
<div class="p-3 border-t flex gap-2"><input id="chatInput" placeholder="Message..." class="flex-1 border rounded-full px-4 py-2 text-sm outline-none"><button id="sendMsgBtn" class="text-[#0095f6] font-semibold text-sm">Send</button></div>
</div>
<div id="emptyChat" class="hidden md:flex flex-1 items-center justify-center flex-col p-8 text-center"><div class="w-24 h-24 rounded-full border-2 flex items-center justify-center mb-4 text-3xl"><i class="fa-regular fa-paper-plane"></i></div><h2 class="text-xl font-light">Your messages</h2><p class="text-sm text-zinc-500">Send private messages</p></div>
</div>

</main>

<aside class="hidden xl:block fixed right-0 top-0 h-screen w-[319px] p-6 bg-[#fafafa]">
<div class="flex items-center gap-3"><img id="rightAvatar" class="w-14 h-14 rounded-full bg-zinc-200"><div><div id="rightUsername" class="font-semibold text-sm"></div><div id="rightFullname" class="text-zinc-500 text-sm"></div></div><button id="switchBtn" class="ml-auto text-[#0095f6] text-xs font-semibold">Switch</button></div>
<div class="mt-6 text-sm text-zinc-500 font-semibold">Suggested for you</div>
<div id="suggested" class="mt-3 space-y-3"></div>
</aside>
</div>
</div>

<!-- Modals -->
<div id="createModal" class="fixed inset-0 z-[100] bg-black/70 hidden items-center justify-center p-4"><div class="bg-white rounded-xl w-full max-w-[700px] overflow-hidden"><div class="flex justify-between p-3 border-b"><button id="closeModal">X</button><span class="font-semibold">Create new post</span><button id="shareBtn" class="text-[#0095f6] font-semibold">Share</button></div><div class="flex flex-col md:flex-row"><div class="flex-1 bg-zinc-50 min-h-[400px] flex items-center justify-center"><div id="uploadArea" class="text-center p-8"><i class="fa-regular fa-images text-6xl mb-4"></i><p class="mb-4">Drag photos here</p><label class="bg-[#0095f6] text-white px-4 py-1.5 rounded-lg text-sm cursor-pointer">Select <input id="fileInput" type="file" accept="image/*,video/*" class="hidden"></label></div><img id="previewImg" class="hidden w-full h-full object-contain"></div><div class="w-full md:w-[300px] p-4"><textarea id="captionInput" placeholder="Write a caption..." class="w-full h-32 outline-none text-sm"></textarea></div></div></div></div>

<div id="storyViewer" class="fixed inset-0 z-[200] bg-black hidden flex-col text-white"><div class="w-full max-w-[500px] mx-auto h-full flex flex-col"><div id="storyProgress" class="flex gap-1 p-2"></div><div class="flex justify-between p-4"><div class="flex gap-2 items-center"><img id="storyUserAvatar" class="w-8 h-8 rounded-full"><span id="storyUserName" class="font-semibold text-sm"></span></div><button id="closeStory">X</button></div><img id="storyImage" class="flex-1 object-contain"><button id="storyPrev" class="absolute left-0 top-0 bottom-0 w-1/2"></button><button id="storyNext" class="absolute right-0 top-0 bottom-0 w-1/2"></button></div></div>

<div id="editModal" class="fixed inset-0 z-[100] bg-black/50 hidden items-center justify-center p-4"><div class="bg-white rounded-xl w-full max-w-[400px] p-6"><h2 class="font-semibold mb-4">Edit profile</h2><div class="flex gap-3 items-center mb-4"><img id="editAvatarPreview" class="w-14 h-14 rounded-full bg-zinc-200"><button id="changeAvatarBtn" class="text-[#0095f6] text-sm">Change photo</button><input id="editAvatarInput" type="file" accept="image/*" class="hidden"></div><input id="editFullName" placeholder="Full Name" class="w-full border rounded p-2 text-sm mb-2"><textarea id="editBio" placeholder="Bio" class="w-full border rounded p-2 text-sm mb-2 h-20"></textarea><input id="editWebsite" placeholder="Website" class="w-full border rounded p-2 text-sm mb-4"><button id="saveProfileBtn" class="w-full bg-[#0095f6] text-white py-2 rounded-lg text-sm font-semibold">Save</button><button id="closeEdit" class="w-full mt-2 text-sm">Cancel</button></div></div>

<script>
const API=location.origin;let token=localStorage.getItem('axra_token');let currentUser=JSON.parse(localStorage.getItem('axra_user')||'null');let currentView='feed';let selectedChatUser=null;let storiesData=[];let currentStoryUserIndex=0;let currentStoryIndex=0;let selectedFile=null;let editAvatarFile=null;const socket=io(API);const $=s=>document.querySelector(s);
function showAuth(){if(token&&currentUser){$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');initApp();return;}$('#auth').classList.remove('hidden');$('#app').classList.add('hidden');}showAuth();
async function doAuth(isLogin){
 const u=$('#username').value.trim();const p=$('#password').value.trim();if(!u||!p){$('#err').textContent='Enter username & password';$('#err').classList.remove('hidden');return;}
 try{const url=isLogin?'/api/auth/login':'/api/auth/register';const body={username:u,password:p,fullName:u};const res=await fetch(API+url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await res.json();if(!res.ok) throw new Error(data.error);token=data.token;currentUser=data.user;localStorage.setItem('axra_token',token);localStorage.setItem('axra_user',JSON.stringify(currentUser));showAuth();}catch(e){$('#err').textContent=e.message;$('#err').classList.remove('hidden');}
}
$('#loginBtn').onclick=()=>doAuth(true);$('#signupBtn').onclick=()=>doAuth(false);
function switchView(v){currentView=v;$('#feedView').classList.toggle('hidden',v!=='feed');$('#profileView').classList.toggle('hidden',v!=='profile');$('#messagesView').classList.toggle('hidden',v!=='messages');if(v==='profile')loadProfile(currentUser.username);if(v==='messages'){loadConversations();$('#emptyChat').classList.toggle('hidden',!!selectedChatUser);}}
document.querySelectorAll('.navBtn').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));
function initApp(){const av=currentUser.avatar||`https://i.pravatar.cc/150?u=${currentUser.username}`;['#sideAvatar','#rightAvatar','#profileAvatar','#editAvatarPreview','#yourStoryAvatar'].forEach(s=>{const el=$(s);if(el){el.src=av;if(s==='#yourStoryAvatar'){el.classList.remove('hidden');$('#yourStoryPlus').classList.add('hidden');}}});$('#sideUsername').textContent=currentUser.username;$('#rightUsername').textContent=currentUser.username;$('#rightFullname').textContent=currentUser.fullName||currentUser.username;$('#profileUsername').textContent=currentUser.username;$('#msgUsername').textContent=currentUser.username;socket.emit('join',currentUser.username);loadFeed();loadStories();}
async function loadFeed(){try{const res=await fetch(API+'/api/posts');const posts=await res.json();$('#loadingFeed')?.remove();const feed=$('#feed');feed.innerHTML='';if(!posts.length){feed.innerHTML='<div class="text-center py-20 text-zinc-500">No posts yet</div>';return;}posts.forEach(p=>feed.appendChild(renderPost(p)));}catch{}}
function renderPost(p){const div=document.createElement('div');div.className='bg-white border border-zinc-300 md:rounded-lg mb-4';const isLiked=p.likes?.includes(currentUser._id);div.innerHTML=`<div class="flex items-center justify-between p-3"><div class="flex gap-3 items-center"><div class="gradient-ring p-[2px] rounded-full"><img src="${p.userAvatar||''}" class="w-8 h-8 rounded-full border-2 border-white bg-zinc-200"></div><span class="font-semibold text-sm">${p.username}</span></div><i class="fa-solid fa-ellipsis"></i></div><div class="relative bg-zinc-100 aspect-square overflow-hidden"><img src="${p.image}" class="w-full h-full object-cover"><div class="like-anim text-white text-[80px]"><i class="fa-solid fa-heart"></i></div></div><div class="p-3"><div class="flex justify-between text-[22px] mb-2"><div class="flex gap-4"><button class="likeBtn ${isLiked?'text-red-500':''}"><i class="${isLiked?'fa-solid':'fa-regular'} fa-heart"></i></button><button><i class="fa-regular fa-comment"></i></button><button class="dmBtn"><i class="fa-regular fa-paper-plane"></i></button></div><i class="fa-regular fa-bookmark"></i></div><div class="font-semibold text-sm">${p.likes?.length||0} likes</div><div class="text-sm"><b>${p.username}</b> ${p.caption||''}</div><div class="commentsList mt-1 text-sm"></div><div class="flex gap-2 mt-2 border-t pt-2"><input placeholder="Add a comment..." class="commentInput flex-1 text-sm outline-none"><button class="postCommentBtn text-[#0095f6] text-sm font-semibold">Post</button></div></div>`;const likeBtn=div.querySelector('.likeBtn');likeBtn.onclick=async()=>{const liked=likeBtn.classList.contains('text-red-500');likeBtn.classList.toggle('text-red-500',!liked);likeBtn.innerHTML=`<i class="${!liked?'fa-solid':'fa-regular'} fa-heart"></i>`;try{await fetch(API+`/api/posts/${p._id}/like`,{method:'POST',headers:{'Authorization':`Bearer ${token}`}});}catch{}};const media=div.querySelector('.relative');let last=0;media.onclick=()=>{const now=Date.now();if(now-last<300){const anim=div.querySelector('.like-anim');anim.classList.add('show');setTimeout(()=>anim.classList.remove('show'),800);if(!likeBtn.classList.contains('text-red-500'))likeBtn.click();}last=now;};const cl=div.querySelector('.commentsList');const rc=l=>{cl.innerHTML=(l||[]).map(c=>`<div><b>${c.username}</b> ${c.text}</div>`).join('');};rc(p.comments);const pc=async()=>{const inp=div.querySelector('.commentInput');const t=inp.value.trim();if(!t)return;try{const r=await fetch(API+`/api/posts/${p._id}/comment`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify({text:t})});const up=await r.json();rc(up.comments);inp.value='';}catch{}};div.querySelector('.postCommentBtn').onclick=pc;div.querySelector('.commentInput').onkeydown=e=>{if(e.key==='Enter')pc();};div.querySelector('.dmBtn').onclick=()=>switchView('messages');return div;}
async function loadStories(){try{const res=await fetch(API+'/api/stories');storiesData=await res.json();const row=$('#storiesRow');row.innerHTML='';storiesData.forEach((g,i)=>{const latest=g.stories[g.stories.length-1];const el=document.createElement('div');el.className='flex flex-col items-center gap-1 min-w-[66px] cursor-pointer';el.innerHTML=`<div class="gradient-ring p-[2px] rounded-full"><img src="${g.userAvatar}" class="w-[60px] h-[60px] rounded-full border-2 border-white object-cover"></div><span class="text-xs truncate w-[64px] text-center">${g.username}</span>`;el.onclick=()=>openStory(i,0);row.appendChild(el);});}catch{}}
function openStory(ui,si){currentStoryUserIndex=ui;currentStoryIndex=si;const group=storiesData[ui];if(!group)return;const story=group.stories[si];$('#storyViewer').classList.remove('hidden');$('#storyViewer').classList.add('flex');$('#storyUserAvatar').src=group.userAvatar;$('#storyUserName').textContent=group.username;$('#storyImage').src=story.image;fetch(API+`/api/stories/${story._id}/view`,{method:'POST',headers:{'Authorization':`Bearer ${token}`}});setTimeout(()=>nextStory(),4000);}
function nextStory(){const g=storiesData[currentStoryUserIndex];if(currentStoryIndex+1<g.stories.length)openStory(currentStoryUserIndex,currentStoryIndex+1);else if(currentStoryUserIndex+1<storiesData.length)openStory(currentStoryUserIndex+1,0);else closeStory();}
function closeStory(){$('#storyViewer').classList.add('hidden');$('#storyViewer').classList.remove('flex');loadStories();}
$('#closeStory').onclick=closeStory;$('#storyNext').onclick=nextStory;$('#storyPrev').onclick=()=>{if(currentStoryIndex>0)openStory(currentStoryUserIndex,currentStoryIndex-1);};
$('#yourStoryBtn').onclick=()=>{const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=async e=>{const file=e.target.files[0];if(!file)return;const fd=new FormData();fd.append('image',file);try{const res=await fetch(API+'/api/stories',{method:'POST',headers:{'Authorization':`Bearer ${token}`},body:fd});if(res.ok)loadStories();}catch{}};inp.click();};
async function loadProfile(username){try{const res=await fetch(API+`/api/profile/${username}`);const data=await res.json();if(!res.ok)return;$('#profileAvatar').src=data.avatar;$('#profileUsername').textContent=data.username;$('#profileFullName').textContent=data.fullName||'';$('#profileBio').textContent=data.bio||'';$('#postsCount').textContent=data.postsCount;$('#followersCount').textContent=data.followersCount;$('#followingCount').textContent=data.followingCount;const grid=$('#profileGrid');grid.innerHTML='';data.posts.forEach(p=>{const d=document.createElement('div');d.className='aspect-square bg-zinc-100 overflow-hidden';d.innerHTML=`<img src="${p.image}" class="w-full h-full object-cover">`;grid.appendChild(d);});}catch{}}
$('#editProfileBtn').onclick=()=>{$('#editModal').classList.remove('hidden');$('#editModal').classList.add('flex');$('#editFullName').value=currentUser.fullName||'';$('#editBio').value=currentUser.bio||'';$('#editWebsite').value=currentUser.website||'';$('#editAvatarPreview').src=currentUser.avatar;};
$('#closeEdit').onclick=()=>{$('#editModal').classList.add('hidden');$('#editModal').classList.remove('flex');};
$('#changeAvatarBtn').onclick=()=>$('#editAvatarInput').click();
$('#editAvatarInput').onchange=e=>{editAvatarFile=e.target.files[0];if(editAvatarFile)$('#editAvatarPreview').src=URL.createObjectURL(editAvatarFile);};
$('#saveProfileBtn').onclick=async()=>{const fd=new FormData();fd.append('fullName',$('#editFullName').value);fd.append('bio',$('#editBio').value);fd.append('website',$('#editWebsite').value);if(editAvatarFile)fd.append('avatar',editAvatarFile);try{const res=await fetch(API+'/api/profile',{method:'PUT',headers:{'Authorization':`Bearer ${token}`},body:fd});const data=await res.json();currentUser={...currentUser,...data};localStorage.setItem('axra_user',JSON.stringify(currentUser));initApp();$('#editModal').classList.add('hidden');$('#editModal').classList.remove('flex');loadProfile(currentUser.username);}catch{}};
function loadConversations(){const convs=JSON.parse(localStorage.getItem('axra_conversations')||'[]');const defaults=['kwame_gh','ama.love','kojo_beats'];const all=[...new Set([...convs,...defaults])];const list=$('#conversations');list.innerHTML='';all.forEach(name=>{if(name===currentUser.username)return;const div=document.createElement('div');div.className='flex items-center gap-3 p-3 hover:bg-zinc-50 cursor-pointer border-b';div.innerHTML=`<img src="https://i.pravatar.cc/150?u=${name}" class="w-14 h-14 rounded-full"><div><div class="font-semibold text-sm">${name}</div><div class="text-xs text-zinc-500">Tap to chat 🇬🇭</div></div>`;div.onclick=()=>openChat(name);list.appendChild(div);});}
function openChat(name){selectedChatUser=name;$('#emptyChat').classList.add('hidden');$('#chatWindow').classList.remove('hidden');$('#chatWindow').classList.add('flex');$('#convList').classList.add('hidden');$('#convList').classList.add('md:flex');$('#chatName').textContent=name;$('#chatAvatar').src=`https://i.pravatar.cc/150?u=${name}`;loadChat(name);const arr=JSON.parse(localStorage.getItem('axra_conversations')||'[]');if(!arr.includes(name)){arr.push(name);localStorage.setItem('axra_conversations',JSON.stringify(arr));}}
async function loadChat(other){const box=$('#chatMessages');box.innerHTML='Loading...';try{const res=await fetch(API+`/api/messages/${other}`,{headers:{'Authorization':`Bearer ${token}`}});const msgs=await res.json();box.innerHTML='';msgs.forEach(m=>{const isMe=m.sender===currentUser.username;const d=document.createElement('div');d.className=`flex ${isMe?'justify-end':'justify-start'}`;d.innerHTML=`<div class="${isMe?'bg-[#0095f6] text-white':'bg-zinc-100'} px-3 py-2 rounded-2xl max-w-[70%] text-sm">${m.text}</div>`;box.appendChild(d);});box.scrollTop=box.scrollHeight;}catch{box.innerHTML='<div class="text-center text-zinc-500 text-xs py-10">No messages yet. Say hi! 🇬🇭</div>';}}
async function sendMsg(){const t=$('#chatInput').value.trim();if(!t||!selectedChatUser)return;const payload={sender:currentUser.username,receiver:selectedChatUser,text:t};const box=$('#chatMessages');const d=document.createElement('div');d.className='flex justify-end';d.innerHTML=`<div class="bg-[#0095f6] text-white px-3 py-2 rounded-2xl max-w-[70%] text-sm">${t}</div>`;box.appendChild(d);box.scrollTop=box.scrollHeight;$('#chatInput').value='';socket.emit('sendMessage',payload);}
$('#sendMsgBtn').onclick=sendMsg;$('#chatInput').onkeydown=e=>{if(e.key==='Enter')sendMsg();};
$('#backToList').onclick=()=>{$('#chatWindow').classList.add('hidden');$('#convList').classList.remove('hidden');$('#convList').classList.add('flex');selectedChatUser=null;};
$('#newMsgBtn').onclick=()=>{const n=prompt('Username to message:');if(n)openChat(n.toLowerCase());};
socket.on('receiveMessage',msg=>{if(selectedChatUser&&(msg.sender===selectedChatUser||msg.receiver===selectedChatUser)){const box=$('#chatMessages');const isMe=msg.sender===currentUser.username;if(!isMe){const d=document.createElement('div');d.className='flex justify-start';d.innerHTML=`<div class="bg-zinc-100 px-3 py-2 rounded-2xl max-w-[70%] text-sm">${msg.text}</div>`;box.appendChild(d);box.scrollTop=box.scrollHeight;}}else{$('#msgBadge').classList.remove('hidden');}});
socket.on('newPost',()=>{if(currentView==='feed')loadFeed();});socket.on('newStory',()=>loadStories());
function openCreate(){ $('#createModal').classList.remove('hidden'); $('#createModal').classList.add('flex'); }
function closeCreate(){ $('#createModal').classList.add('hidden'); $('#createModal').classList.remove('flex'); $('#previewImg').classList.add('hidden'); $('#uploadArea').classList.remove('hidden'); selectedFile=null; }
$('#createBtnDesktop').onclick=openCreate; $('#closeModal').onclick=closeCreate;
$('#fileInput').onchange=e=>{const f=e.target.files[0];if(!f)return;selectedFile=f;$('#uploadArea').classList.add('hidden');$('#previewImg').src=URL.createObjectURL(f);$('#previewImg').classList.remove('hidden');};
$('#shareBtn').onclick=async()=>{if(!selectedFile&&!$('#captionInput').value)return;$('#shareBtn').textContent='Sharing...';try{const fd=new FormData();if(selectedFile)fd.append('image',selectedFile);fd.append('caption',$('#captionInput').value);const res=await fetch(API+'/api/posts',{method:'POST',headers:{'Authorization':`Bearer ${token}`},body:fd});if(res.ok){closeCreate();loadFeed();switchView('feed');}}catch{}finally{$('#shareBtn').textContent='Share';}};
$('#logoutBtn').onclick=$('#switchBtn').onclick=()=>{localStorage.clear();location.reload();};
</script>
</body>
</html>
