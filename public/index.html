<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>AXRACONNECT</title>
</head>
<body>
	<script>
"use strict";

// =====================================
// AXRACONNECT - MAIN JAVASCRIPT
// =====================================

const API = "/api";

let currentUser = null;
let selectedUser = null;
let socket = null;
let posts = [];
let users = [];

// Get HTML elements safely
const $ = (selector) => document.querySelector(selector);

function showMessage(message, type = "error") {
	const element =
		$("#messageStatus") ||
		$("#error") ||
		$("#statusMessage");

	if (element) {
		element.textContent = message;
		element.style.color =
			type === "success" ? "#25c58a" : "#ff6b75";
	} else {
		alert(message);
	}
}

// =====================================
// API REQUEST HELPER
// =====================================

async function apiRequest(path, options = {}) {
	const response = await fetch(`${API}${path}`, {
		...options,
		credentials: "same-origin",
		headers: {
			"Content-Type": "application/json",
			...(options.headers || {})
		}
	});

	const data = await response.json().catch(() => ({}));

	if (!response.ok) {
		throw new Error(
			data.message ||
			data.error ||
			`Request failed: ${response.status}`
		);
	}

	return data;
}

// =====================================
// AUTHENTICATION: TAB SWITCHING
// =====================================

function showLogin() {
	const loginForm = $("#loginForm");
	const registerForm = $("#registerForm");

	if (loginForm) loginForm.style.display = "block";
	if (registerForm) registerForm.style.display = "none";

	$("#loginTab")?.classList.add("active");
	$("#registerTab")?.classList.remove("active");

	showMessage("");
}

function showRegister() {
	const loginForm = $("#loginForm");
	const registerForm = $("#registerForm");

	if (loginForm) loginForm.style.display = "none";
	if (registerForm) registerForm.style.display = "block";

	$("#registerTab")?.classList.add("active");
	$("#loginTab")?.classList.remove("active");

	showMessage("");
}

// =====================================
// REGISTER ACCOUNT
// HTML form ID: registerForm
// =====================================

$("#registerTab")?.addEventListener("click", showRegister);
$("#loginTab")?.addEventListener("click", showLogin);

$("#registerForm")?.addEventListener("submit", async (event) => {
	event.preventDefault();

	const form = event.currentTarget;
	const button = form.querySelector('button[type="submit"]') ||
								 form.querySelector("button");

	const values = new FormData(form);

	const account = {
		name: String(values.get("name") || "").trim(),
		username: String(values.get("username") || "")
			.trim()
			.replace(/^@/, ""),
		email: String(values.get("email") || "").trim().toLowerCase(),
		country: String(values.get("country") || "").trim(),
		password: String(values.get("password") || ""),
		inviteCode: String(values.get("inviteCode") || "").trim()
	};

	if (
		!account.name ||
		!account.username ||
		!account.email ||
		!account.country ||
		!account.password ||
		!account.inviteCode
	) {
		showMessage("Please complete every field.");
		return;
	}

	if (account.password.length < 10) {
		showMessage("Your password must contain at least 10 characters.");
		return;
	}

	try {
		if (button) {
			button.disabled = true;
			button.textContent = "Creating account...";
		}

		const result = await apiRequest("/register", {
			method: "POST",
			body: JSON.stringify(account)
		});

		showMessage(
			result.message || "Account created successfully!",
			"success"
		);

		if (result.user) {
			currentUser = result.user;
			await openApplication();
		} else {
			showLogin();
			showMessage(
				"Account created. Please sign in.",
				"success"
			);
		}
	} catch (error) {
		console.error("Registration error:", error);
		showMessage(error.message || "Registration failed.");
	} finally {
		if (button) {
			button.disabled = false;
			button.textContent = "Create Account";
		}
	}
});

// =====================================
// LOGIN
// HTML form ID: loginForm
// =====================================

$("#loginForm")?.addEventListener("submit", async (event) => {
	event.preventDefault();

	const form = event.currentTarget;
	const button = form.querySelector('button[type="submit"]') ||
								 form.querySelector("button");

	const values = new FormData(form);

	const credentials = {
		email: String(values.get("email") || "").trim().toLowerCase(),
		password: String(values.get("password") || "")
	};

	if (!credentials.email || !credentials.password) {
		showMessage("Enter your email and password.");
		return;
	}

	try {
		if (button) {
			button.disabled = true;
			button.textContent = "Signing in...";
		}

		const result = await apiRequest("/login", {
			method: "POST",
			body: JSON.stringify(credentials)
		});

		currentUser = result.user || null;

		await openApplication();
		showMessage("Welcome back!", "success");
	} catch (error) {
		console.error("Login error:", error);
		showMessage(error.message || "Unable to sign in.");
	} finally {
		if (button) {
			button.disabled = false;
			button.textContent = "Sign In";
		}
	}
});

// =====================================
// OPEN THE MAIN APP
// =====================================

async function openApplication() {
	const auth = $("#auth");
	const app = $("#app");

	if (auth) auth.style.display = "none";
	if (app) app.style.display = "flex";

	if (currentUser) {
		const profile = $("#profile");

		if (profile) {
			profile.textContent =
				currentUser.name || currentUser.username || "My profile";
		}
	}

	await loadUsers();
	await loadPosts();

	connectSocket();
}

// =====================================
// CHECK EXISTING SESSION
// =====================================

async function checkSession() {
	try {
		const result = await apiRequest("/me");

		currentUser = result.user || null;

		if (currentUser) {
			await openApplication();
		} else {
			showLogin();
		}
	} catch (error) {
		console.log("No active session:", error.message);
		showLogin();
	}
}

// =====================================
// LOGOUT
// =====================================

$("#logout")?.addEventListener("click", async () => {
	try {
		await apiRequest("/logout", { method: "POST" });
	} catch (error) {
		console.error("Logout error:", error);
	}

	if (socket) socket.disconnect();

	currentUser = null;
	selectedUser = null;

	const app = $("#app");
	const auth = $("#auth");

	if (app) app.style.display = "none";
	if (auth) auth.style.display = "flex";

	showLogin();
});

// =====================================
// SEARCH USERS
// Requires GET /api/users?q=
// =====================================

async function loadUsers(search = "") {
	const list = $("#peopleList");
	if (!list) return;

	list.innerHTML = "<p>Loading people...</p>";

	try {
		const result = await apiRequest(
			`/users?q=${encodeURIComponent(search)}`
		);

		users = Array.isArray(result)
			? result
			: result.users || [];

		list.replaceChildren();

		if (users.length === 0) {
			list.textContent = "No people found.";
			return;
		}

		users.forEach((user) => {
			if (currentUser && user.id === currentUser.id) return;

			const button = document.createElement("button");
			button.className = "person";
			button.type = "button";

			const name = document.createElement("strong");
			name.textContent = user.name || user.username || "Member";

			const country = document.createElement("span");
			country.textContent = user.country || "";

			button.append(name, country);

			button.addEventListener("click", () => openChat(user));
			list.appendChild(button);
		});
	} catch (error) {
		console.error("User search error:", error);
		list.textContent = `Could not load users: ${error.message}`;
	}
}

$("#search")?.addEventListener("input", (event) => {
	loadUsers(event.target.value.trim());
});

// =====================================
// REAL-TIME CHAT
// Requires Socket.IO on the server
// =====================================

function connectSocket() {
	if (typeof io !== "function") {
		console.warn("Socket.IO client was not loaded.");
		return;
	}

	if (socket) socket.disconnect();

	socket = io({ withCredentials: true });

	socket.on("connect", () => {
		console.log("Connected to chat server.");
	});

	socket.on("connect_error", (error) => {
		console.error("Chat connection error:", error.message);
	});

	socket.on("private_message", (message) => {
		if (
			selectedUser &&
			(
				String(message.senderId) === String(selectedUser.id) ||
				String(message.receiverId) === String(selectedUser.id)
			)
		) {
			displayMessage(message);
		}
	});

	socket.on("user_online", (userId) => {
		console.log("User online:", userId);
	});

	socket.on("user_offline", (userId) => {
		console.log("User offline:", userId);
	});
}

// =====================================
// OPEN PRIVATE CHAT
// Requires GET /api/messages/:userId
// =====================================

async function openChat(user) {
	selectedUser = user;

	const header = $("#chatHeader");
	const input = $("#messageInput");
	const sendButton = $("#send");
	const messages = $("#messages");

	if (header) {
		header.textContent =
			user.name || user.username || "Private chat";
	}

	if (input) input.disabled = false;
	if (sendButton) sendButton.disabled = false;

	if (messages) messages.replaceChildren();

	try {
		const result = await apiRequest(
			`/messages/${encodeURIComponent(user.id)}`
		);

		const history = Array.isArray(result)
			? result
			: result.messages || [];

		history.forEach(displayMessage);
	} catch (error) {
		console.error("Message history error:", error);

		if (messages) {
			messages.textContent =
				`Could not load chat history: ${error.message}`;
		}
	}

	input?.focus();
}

// =====================================
// DISPLAY MESSAGE SAFELY
// =====================================

function displayMessage(message) {
	const container = $("#messages");
	if (!container) return;

	const bubble = document.createElement("div");

	const mine =
		currentUser &&
		String(message.senderId ?? message.sender_id) ===
			String(currentUser.id);

	bubble.className = mine ? "message mine" : "message";

	const text = document.createElement("p");
	text.textContent =
		message.text || message.content || message.message || "";

	bubble.appendChild(text);
	container.appendChild(bubble);
	container.scrollTop = container.scrollHeight;
}

// =====================================
// SEND PRIVATE MESSAGE
// =====================================

$("#messageForm")?.addEventListener("submit", (event) => {
	event.preventDefault();

	const input = $("#messageInput");
	const text = input?.value.trim();

	if (!text || !selectedUser) {
		showMessage("Choose a person and enter a message.");
		return;
	}

	if (!socket || !socket.connected) {
		showMessage("Chat server is disconnected. Refresh and try again.");
		return;
	}

	socket.emit("private_message", {
		receiverId: selectedUser.id,
		text
	});

	input.value = "";
	input.focus();
});

// =====================================
// SOCIAL POSTS / FEED
// Requires GET /api/posts
// =====================================

async function loadPosts() {
	const feed = $("#feed");
	if (!feed) return;

	feed.innerHTML = "<p>Loading posts...</p>";

	try {
		const result = await apiRequest("/posts");

		posts = Array.isArray(result)
			? result
			: result.posts || [];

		renderPosts();
	} catch (error) {
		console.warn("Posts endpoint unavailable:", error.message);
		feed.textContent =
			"The posts feed needs a GET /api/posts endpoint in server.js.";
	}
}

function renderPosts() {
	const feed = $("#feed");
	if (!feed) return;

	feed.replaceChildren();

	posts.forEach((post) => {
		const card = document.createElement("article");
		card.className = "post";

		const author = document.createElement("h3");
		author.textContent =
			post.name || post.username || "AxraConnect member";

		const content = document.createElement("p");
		content.textContent = post.content || post.text || "";

		const actions = document.createElement("div");
		actions.className = "post-actions";

		const likeButton = document.createElement("button");
		likeButton.type = "button";
		likeButton.textContent =
			`❤️ Like (${Number(post.likesCount || post.likes || 0)})`;

		likeButton.addEventListener("click", async () => {
			try {
				await apiRequest(`/posts/${post.id}/like`, {
					method: "POST"
				});

				post.likesCount = Number(post.likesCount || post.likes || 0) + 1;
				renderPosts();
			} catch (error) {
				showMessage(
					"Like feature needs POST /api/posts/:id/like on the server."
				);
				console.error(error);
			}
		});

		actions.appendChild(likeButton);
		card.append(author, content, actions);

		if (post.imageUrl) {
			const image = document.createElement("img");
			image.src = post.imageUrl;
			image.alt = "Post image";
			image.loading = "lazy";
			card.insertBefore(image, actions);
		}

		feed.appendChild(card);
	});
}

// =====================================
// CREATE A POST
// Requires form ID: postForm
// and input/textarea name="content"
// =====================================

$("#postForm")?.addEventListener("submit", async (event) => {
	event.preventDefault();

	const form = event.currentTarget;
	const field = form.elements.namedItem("content");
	const content = field?.value.trim();

	if (!content) {
		showMessage("Write something before posting.");
		return;
	}

	try {
		await apiRequest("/posts", {
			method: "POST",
			body: JSON.stringify({ content })
		});

		field.value = "";
		await loadPosts();
		showMessage("Post published!", "success");
	} catch (error) {
		console.error("Create post error:", error);
		showMessage(
			"Posting needs a POST /api/posts endpoint in server.js."
		);
	}
});

// =====================================
// START APP WHEN PAGE LOADS
// =====================================

document.addEventListener("DOMContentLoaded", () => {
	checkSession();
});
	</script>
</body>
</html>
<script src="/socket.io/socket.io.js"></script>
<script src="/main.js"></script>
