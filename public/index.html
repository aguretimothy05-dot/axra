<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Axra Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{display:flex;height:100vh;background:#0f0f0f;color:#fff;font-family:system-ui}
#sidebar{width:320px;background:#171717;border-right:1px solid #2a2a2a;display:flex;flex-direction:column;overflow:hidden}
#chatList{flex:1;overflow-y:auto}
.chatItem{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border-left:3px solid transparent}
.chatItem:hover{background:#1f1f1f}
.chatItem.active{background:#1e3a5f;border-left-color:#3b82f6}
.avatar{width:40px;height:40px;border-radius:50%;background:#2a5bd7;display:flex;align-items:center;justify-content:center;font-weight:700}
.chatInfo{flex:1}
.name{font-weight:600;font-size:15px}
.last{font-size:12px;color:#888}
#chatPane{flex:1;display:flex;flex-direction:column;background:#0f0f0f}
#chatHeader{padding:14px 20px;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;gap:10px}
#backBtn{display:none;cursor:pointer;padding:6px 10px;background:#222;border-radius:6px}
#messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:70%;padding:10px 14px;border-radius:12px;background:#1e1e1e}
.msg.me{align-self:flex-end;background:#2563eb}
#inputArea{display:flex;gap:10px;padding:14px;border-top:1px solid #2a2a2a}
#msgInput{flex:1;padding:12px;border-radius:20px;border:1px solid #2a2a2a;background:#1a1a1a;color:#fff;outline:none}
button{padding:10px 18px;border-radius:20px;border:none;background:#2563eb;color:#fff;font-weight:600;cursor:pointer}
@media(max-width:768px){#sidebar{position:absolute;left:0;top:0;bottom:0;width:100%;z-index:10}#sidebar.hidden{display:none}#backBtn{display:block}#chatPane{width:100%}}
</style>
</head>
<body>
<div id="sidebar">
<div style="padding:16px;font-weight:800;font-size:20px">Axra</div>
<div id="chatList"></div>
</div>
<div id="chatPane">
<div id="chatHeader">
<span id="backBtn" onclick="showList()">← Back</span>
<div>
<div id="chatName" style="font-weight:700">Global Chat</div>
<div id="chatStatus" style="font-size:12px;color:#888">Axra Global • Online</div>
</div>
</div>
<div id="messages"></div>
<div id="inputArea">
<input id="msgInput" placeholder="Type a message...">
<button onclick="send()">Send</button>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
let allUsers=[],groups=[],currentChat={type:"global",id:null};
let token=localStorage.getItem('token');
let myUser=JSON.parse(localStorage.getItem('user')||'null');

async function api(p,opts={}){
 opts.headers={...(opts.headers||{}),'Content-Type':'application/json'};
 if(token) opts.headers['Authorization']='Bearer '+token;
 let r=await fetch(p,opts);
 return r.json();
}
function showList(){ if(window.innerWidth<=768){ $('sidebar').classList.remove('hidden'); } }
function showChat(){ if(window.innerWidth<=768){ $('sidebar').classList.add('hidden'); } }

function renderList(q=''){
 const list=$('chatList');
 list.innerHTML='';
 let items=[];
 items.push({username:'Global',name:'Global Chat',isGlobal:true});
 items=items.concat(allUsers.map(u=>({...u,name:u.name||u.username})));
 items=items.concat(groups.map(g=>({...g,isGroup:true,name:g.name})));
 const filter=q.toLowerCase();
 items.filter(u=>!q|| (u.name||'').toLowerCase().includes(filter) || (u.username||'').toLowerCase().includes(filter))
.forEach(u=>{
	const el=document.createElement('div');
	const isActive = (u.isGlobal && currentChat.type==='global') || (!u.isGlobal &&!u.isGroup && currentChat.id === (u._id||u.id)) || (u.isGroup && currentChat.id === (u._id||u.id));
	el.className='chatItem'+(isActive?' active':'');
	const initial=(u.username||u.name||'G')[0].toUpperCase();
	el.innerHTML=`<div class="avatar">${initial}</div><div class="chatInfo"><div class="name">${u.isGlobal?'Global Chat':(u.name||u.username)}</div><div class="last">${u.isGlobal?'Axra Global': u.isGroup?'Group • '+u.name : '@'+u.username}</div></div>`;
	el.onclick=()=>{
	 if(u.isGlobal) loadGlobal();
	 else if(u.isGroup) openGroup(u);
	 else openPrivate(u);
	};
	list.appendChild(el);
 });
}
async function loadGlobal(){
 currentChat={type:'global',id:null};
 $('chatName').textContent='Global Chat';
 $('chatStatus').textContent='Axra Global • Online';
 renderList(); showChat();
 const data=await api('/api/messages/global');
 renderMessages(data||[]);
}
function openPrivate(u){
 const realId=u._id||u.id;
 if(!realId){ alert('User ID missing!'); return; }
 currentChat={type:'private',id:realId, user:u};
 $('chatName').textContent=u.name||u.username;
 $('chatStatus').textContent='@'+u.username;
 renderList(); showChat();
 loadPrivate(realId);
}
function openGroup(g){
 const realId=g._id||g.id;
 currentChat={type:'group',id:realId};
 $('chatName').textContent=g.name;
 $('chatStatus').textContent='Group • '+g.name;
 renderList(); showChat();
 loadGroup(realId);
}
async function loadPrivate(id){
 $('messages').innerHTML='<div style="color:#888">Loading...</div>';
 const data=await api('/api/messages/private/'+id);
 renderMessages(data||[]);
}
async function loadGroup(id){
 $('messages').innerHTML='<div style="color:#888">Loading...</div>';
 const data=await api('/api/messages/group/'+id);
 renderMessages(data||[]);
}
function renderMessages(msgs){
 const box=$('messages');
 box.innerHTML='';
 (msgs||[]).forEach(m=>{
	const isMe = myUser && (m.sender===myUser._id || m.sender_id===myUser._id || m.sender_username===myUser.username);
	const text=m.text||m.message||'';
	const sender=m.sender_username||m.senderUsername||'';
	const div=document.createElement('div');
	div.className='msg'+(isMe?' me':'');
	div.innerHTML = (currentChat.type==='global' &&!isMe? `<div style="font-size:11px;color:#60a5fa;margin-bottom:4px;font-weight:600">${sender}</div>`:'') + `<div style="white-space:pre-wrap;word-break:break-word">${text}</div>`;
	box.appendChild(div);
 });
 box.scrollTop=box.scrollHeight;
}
async function send(){
 const input=$('msgInput');
 const txt=input.value.trim();
 if(!txt) return;
 input.value='';
 const box=$('messages');
 const temp=document.createElement('div');
 temp.className='msg me';
 temp.textContent=txt;
 box.appendChild(temp);
 box.scrollTop=box.scrollHeight;
 try{
	if(currentChat.type==='global'){
	 await api('/api/messages/global',{method:'POST',body:JSON.stringify({text:txt})});
	}else if(currentChat.type==='private'){
	 await api('/api/messages/private/'+currentChat.id,{method:'POST',body:JSON.stringify({text:txt})});
	}else if(currentChat.type==='group'){
	 await api('/api/messages/group/'+currentChat.id,{method:'POST',body:JSON.stringify({text:txt})});
	}
 }catch(e){console.error(e)}
}
$('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
(async()=>{
 if(!token){
	let username=prompt('Enter your username to login (e.g. Timm)');
	if(!username) return;
	let r=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username})});
	if(r.token){ token=r.token; localStorage.setItem('token',token); localStorage.setItem('user',JSON.stringify(r.user)); myUser=r.user; }
	else { alert('Login failed, try register first'); return; }
 }
 try{
	const users=await api('/api/users'); allUsers=(users||[]).filter(u=>!myUser|| (u._id||u.id)!==(myUser._id||myUser.id));
 }catch{}
 try{
	const g=await api('/api/groups'); groups=g||[];
 }catch{}
 renderList();
 loadGlobal();
})();
try{
 const s=document.createElement('script');
 s.src='/socket.io/socket.io.js';
 s.onload=()=>{
	const socket=io();
	socket.on('newMessage',()=>{
	 if(currentChat.type==='global') loadGlobal();
	 else if(currentChat.type==='private') loadPrivate(currentChat.id);
	 else if(currentChat.type==='group') loadGroup(currentChat.id);
	});
 };
 document.body.appendChild(s);
}catch{}
</script>
</body>
</html>
